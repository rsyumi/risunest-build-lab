[package]
name = "risunest-prompt"
version = "0.1.0"
edition = "2021"
publish = false
license-file = "../../../LICENSE"

[dependencies]
risunest-ir = { path = "../ir" }
risunest-jinja = { path = "../jinja" }
risunest-records = { path = "../records" }

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
risunest-tokenizer = { path = "../tokenizer", features = ["huggingface"] }
risunest-regex = { path = "../regex" }
risunest-lorebook = { path = "../lorebook" }
risunest-cbs-experimental = { path = "../../cbs-experimental" }
risunest-triggers = { path = "../triggers" }
