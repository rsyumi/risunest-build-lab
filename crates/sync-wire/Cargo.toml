[package]
name = "risunest-sync-wire"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.0"
hex = "0.4"
base64 = "0.23.1"
ryu-js = "1.0.3"
zstd = { version = "0.13", default-features = false, optional = true }

[features]
# zstd request and response bodies, for the Sync server and the app.
body-codec = ["dep:zstd"]
