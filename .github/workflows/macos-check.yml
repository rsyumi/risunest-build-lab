name: Apple and Linux release build lab
run-name: Native test packages / ${{ inputs.source_sha }} / Apple ${{ inputs.include_apple }} / Sync ${{ inputs.include_sync }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full macOS-lane snapshot commit SHA in this build-lab repository
        type: string
        required: true
      include_apple:
        description: Run macOS and iOS app jobs (and macOS Sync when enabled)
        type: boolean
        default: true
      include_sync:
        description: Run Sync builds, packages, and lifecycle checks
        type: boolean
        default: true
      include_linux:
        description: Run Linux app and enabled Sync jobs
        type: boolean
        default: true
      include_linux_app:
        description: Include Linux app packages when Linux jobs are enabled
        type: boolean
        default: true
      include_windows:
        description: Run native Windows ARM app and enabled Sync jobs
        type: boolean
        default: false
      include_windows_app:
        description: Include the app when Windows ARM jobs are enabled
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apple-release-build-lab-${{ github.ref_name }}-${{ inputs.source_sha }}-${{ inputs.include_apple }}-${{ inputs.include_sync }}-${{ inputs.include_linux }}-${{ inputs.include_linux_app }}-${{ inputs.include_windows }}
  cancel-in-progress: false

jobs:
  windows-arm:
    if: inputs.include_windows
    uses: ./.github/workflows/windows-arm-release-check.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      include_sync: ${{ inputs.include_sync }}
      include_app: ${{ inputs.include_windows_app }}

  apple:
    name: ${{ matrix.name }}
    if: inputs.include_apple
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64 agent test packages
            id: macos-arm64
            kind: macos
            runner: macos-15
            rust_target: aarch64-apple-darwin
            arch: aarch64
            macho_arch: arm64
            sdk: macosx
          - name: macOS x64 agent test packages
            id: macos-x64
            kind: macos
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            arch: x86_64
            macho_arch: x86_64
            sdk: macosx
          - name: iPhoneOS ARM64 unsigned agent test package
            id: ios-arm64
            kind: ios
            runner: macos-15
            rust_target: aarch64-apple-ios
            arch: aarch64
            macho_arch: arm64
            sdk: iphoneos
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Select matching iOS toolchain
        if: matrix.kind == 'ios'
        working-directory: ${{ github.workspace }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          sudo xcode-select --switch "$DEVELOPER_DIR"
          swift_bin="$DEVELOPER_DIR/Toolchains/XcodeDefault.xctoolchain/usr/bin"
          test -x "$swift_bin/swift"
          printf '%s\n' "$swift_bin" >> "$GITHUB_PATH"
          export PATH="$swift_bin:$PATH"
          xcrun --find swift
          swift --version

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Verify snapshot and record environment
        id: environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          node ../control/scripts/verify-snapshot.mjs . macos
          mkdir -p artifacts
          cp .build-lab/source.json artifacts/source.json
          cp .build-lab/files.json artifacts/files.json
          {
            printf 'artifact_scope=agent-test-build-only\n'
            printf 'workflow_sha=%s\nsnapshot_sha=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$SNAPSHOT_SHA" "$GITHUB_RUN_ATTEMPT"
            printf 'matrix_id=%s\nrunner=%s\nrust_target=%s\n' '${{ matrix.id }}' '${{ matrix.runner }}' '${{ matrix.rust_target }}'
            sw_vers
            uname -a
            rustc -Vv
            cargo -V
            node -v
            pnpm -v
            xcode-select -p
            xcodebuild -version
            xcrun --sdk '${{ matrix.sdk }}' --show-sdk-version
            df -h .
            shasum -a 256 pnpm-lock.yaml src-tauri/Cargo.lock
          } > artifacts/environment.txt
          cat artifacts/environment.txt
          sdk_hash="$( { xcodebuild -version; xcrun --sdk '${{ matrix.sdk }}' --show-sdk-version; } | shasum -a 256 | cut -d' ' -f1)"
          printf 'sdk_hash=%s\n' "$sdk_hash" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: apple-agent-test-build-v1
          key: ${{ matrix.id }}-${{ steps.environment.outputs.sdk_hash }}
          workspaces: source/src-tauri -> target
          cache-bin: false
          cache-on-failure: true

      - name: Prepare iOS project tools
        if: matrix.kind == 'ios'
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          if ! command -v idevice_id >/dev/null; then brew install libimobiledevice; fi
          xcodegen --version
          idevice_id --version

      - name: Install locked frontend inputs
        run: pnpm install --frozen-lockfile

      - name: Build and verify agent frontend
        run: |
          set -euo pipefail
          pnpm build:agent 2>&1 | tee artifacts/frontend.log
          node ../control/scripts/verify-macos-inputs.mjs .
          if [ '${{ matrix.kind }}' = macos ]; then
            printf '%s\n' '{"build":{"beforeBuildCommand":"test -f dist/index.html"},"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/apple-prebuilt.json"
          else
            printf '%s\n' '{"build":{"beforeBuildCommand":"test -f dist/index.html"},"bundle":{"iOS":{"bundleVersion":"1"}}}' > "$RUNNER_TEMP/apple-prebuilt.json"
          fi
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          writeFileSync(
            "artifacts/release-input.json",
            `${JSON.stringify({ version: config.version, mobileBuildNumber: 1, iosBuildNumber: "1" }, null, 2)}\n`,
          );
          NODE

      - name: Run macOS app Rust tests
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          contract_tmp="$(mktemp -d "$RUNNER_TEMP/risunest-agent-test-contracts.XXXXXX")"
          export TMPDIR="$(cd "$contract_tmp" && pwd -P)"
          printf 'rust_test_tmpdir=%s\n' "$TMPDIR" >> artifacts/environment.txt
          cargo test --manifest-path src-tauri/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked --lib -- --test-threads=1 2>&1 | tee artifacts/rust-tests.log
          cargo test --manifest-path src-tauri/Cargo.toml --package tauri-plugin-updater --target '${{ matrix.rust_target }}' --release --locked --lib -- --test-threads=1 2>&1 | tee -a artifacts/rust-tests.log

      - name: Run macOS Sync Rust tests
        if: matrix.kind == 'macos' && inputs.include_sync
        run: |
          set -euo pipefail
          contract_tmp="$(mktemp -d "$RUNNER_TEMP/risunest-sync-agent-test-contracts.XXXXXX")"
          export TMPDIR="$(cd "$contract_tmp" && pwd -P)"
          printf 'sync_rust_test_tmpdir=%s\n' "$TMPDIR" >> artifacts/environment.txt
          cargo test --manifest-path server/sync/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked -- --test-threads=1 2>&1 | tee -a artifacts/rust-tests.log
          cargo test --manifest-path server/manager/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked -- --test-threads=1 2>&1 | tee -a artifacts/rust-tests.log

      - name: Generate ephemeral test-only updater key
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/risunest-agent-test-updater-${{ matrix.id }}.key"
          python3 - "$key_file" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              ["pnpm", "tauri", "signer", "generate", "--ci", "--password", "", "--write-keys", sys.argv[1]],
              check=True,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              timeout=30,
          )
          PY
          test -s "$key_file"
          private_key="$(cat "$key_file")"
          echo "::add-mask::$private_key"
          delimiter="RISUNEST_TEST_KEY_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'TAURI_SIGNING_PRIVATE_KEY<<%s\n' "$delimiter"
            printf '%s\n' "$private_key"
            printf '%s\n' "$delimiter"
            printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n'
          } >> "$GITHUB_ENV"
          node --input-type=module - "$key_file.pub" "$RUNNER_TEMP/apple-prebuilt.json" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const [publicKeyPath, configPath] = process.argv.slice(2);
          const publicKey = readFileSync(publicKeyPath, "utf8").trim();
          const config = JSON.parse(readFileSync(configPath, "utf8"));
          config.plugins = { ...config.plugins, updater: { pubkey: publicKey, endpoints: [] } };
          writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`);
          writeFileSync(process.env.GITHUB_ENV, `RISUNEST_UPDATE_PUBLIC_KEY<<RISUNEST_PUBLIC_KEY\n${publicKey}\nRISUNEST_PUBLIC_KEY\n`, { flag: "a" });
          NODE
          printf 'ephemeral_updater_key=true\n' >> artifacts/environment.txt
          rm -f "$key_file" "$key_file.pub"

      - name: Build ad-hoc signed macOS test packages
        if: matrix.kind == 'macos'
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          pnpm tauri build --ci --target '${{ matrix.rust_target }}' --bundles app,dmg \
            --config src-tauri/tauri.agent.conf.json \
            --config "$RUNNER_TEMP/apple-prebuilt.json" -- --locked 2>&1 | tee artifacts/native-build.log

      - name: Verify and collect macOS test packages
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          release="$CARGO_TARGET_DIR/${{ matrix.rust_target }}/release"
          app="$release/bundle/macos/RisuNest.app"
          binary="$app/Contents/MacOS/RisuNest"
          test -d "$app"
          test -x "$binary"
          plutil -lint "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = io.github.rsyumi.risunest
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 14.0
          lipo "$binary" -verify_arch '${{ matrix.macho_arch }}'
          codesign --verify --deep --strict "$app" 2>&1 | tee artifacts/codesign.txt
          codesign -dv --verbose=4 "$app" 2>> artifacts/codesign.txt
          grep -Fx 'Signature=adhoc' artifacts/codesign.txt
          node scripts/release/package-app.mjs \
            --kind desktop \
            --os macos \
            --arch '${{ matrix.arch }}' \
            --bundle-dir "$release/bundle" \
            --binary "$binary" \
            --output artifacts/package-proof \
            --release-input artifacts/release-input.json
          dmg="$(find "$release/bundle/dmg" -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          updater="$(find "$release/bundle/macos" -maxdepth 1 -type f -name '*.app.tar.gz' -print -quit)"
          test -n "$dmg"
          test -n "$updater"
          test -s "$updater.sig"
          mkdir -p artifacts/packages
          cp "$dmg" "artifacts/packages/RisuNest-agent-test-macos-${{ matrix.arch }}.dmg"
          cp "$updater" "artifacts/packages/RisuNest-agent-test-macos-${{ matrix.arch }}.app.tar.gz"
          cp "$updater.sig" "artifacts/packages/RisuNest-agent-test-macos-${{ matrix.arch }}.app.tar.gz.sig"
          shasum -a 256 artifacts/packages/* > artifacts/packages.sha256
          file "$binary" > artifacts/binary.txt
          cat artifacts/binary.txt artifacts/packages.sha256

      - name: Replace a disposable macOS app through the production updater
        if: matrix.kind == 'macos'
        run: |
          set -euo pipefail
          export RISUNEST_MAC_UPDATE_ARCHIVE="$CARGO_TARGET_DIR/${{ matrix.rust_target }}/release/bundle/macos/RisuNest.app.tar.gz"
          cargo test --manifest-path src-tauri/Cargo.toml --package tauri-plugin-updater --target '${{ matrix.rust_target }}' --release --locked --lib updater::tests::produced_macos_archive_replaces_disposable_app_and_preserves_sibling_data -- --ignored --exact --nocapture 2>&1 | tee artifacts/app-update-install.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/app-update-install.log

      - name: Install locked Sync GUI inputs
        if: matrix.kind == 'macos' && inputs.include_sync
        run: pnpm install --dir server/manager/gui --frozen-lockfile

      - name: Prepare synthetic Sync package inputs
        if: matrix.kind == 'macos' && inputs.include_sync
        run: |
          set -euo pipefail
          test ! -e server/sync/README.md
          cat > server/sync/README.md <<'README'
          # RisuNest Sync agent test package

          Synthetic documentation generated only inside the isolated release build lab.
          README
          sync_work="$RUNNER_TEMP/risunest-sync-agent-test-${{ matrix.id }}"
          mkdir -p "$sync_work/native" "$sync_work/raw" "$sync_work/packages" artifacts/sync/packages
          printf 'synthetic_sync_readme=true\n' >> artifacts/environment.txt
          printf 'RISUNEST_SYNC_TEST_WORK=%s\n' "$sync_work" >> "$GITHUB_ENV"
          node scripts/release/vendor.mjs --target 'darwin-${{ matrix.arch }}' --output "$sync_work/vendor"
          node --input-type=module - "$sync_work" <<'NODE'
          import { copyFileSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const work = process.argv[2];
          const version = JSON.parse(readFileSync("server/version.json", "utf8"));
          const vendorInput = JSON.parse(readFileSync("scripts/release/cloudflared.json", "utf8"));
          const { releaseDownloads } = await import("./scripts/release/downloads.mjs");
          const source = JSON.parse(readFileSync(".build-lab/source.json", "utf8"));
          writeFileSync(
            "artifacts/sync/release-input.json",
            `${JSON.stringify({
              product: "sync",
              tag: `sync-v${version.version}`,
              sourceCommit: source.source_commit,
              version: version.version,
              compatibility: version.compatibility,
              vendorInput,
              expectedDownloads: releaseDownloads("sync", version.version),
            }, null, 2)}\n`,
          );
          const vendor = JSON.parse(readFileSync(join(work, "vendor/vendor.json"), "utf8"));
          copyFileSync(join(work, "vendor/vendor.json"), "artifacts/sync/vendor.json");
          const env = `RISUNEST_CLOUDFLARED_INPUT=${join(work, "vendor/vendor.json")}\n`;
          writeFileSync(process.env.GITHUB_ENV, env, { flag: "a" });
          if (vendor.actualArch !== '${{ matrix.arch }}')
            throw new Error("Pinned macOS cloudflared architecture mismatch.");
          NODE

      - name: Build and package macOS Sync agent test suite
        if: matrix.kind == 'macos' && inputs.include_sync
        env:
          APPLE_SIGNING_IDENTITY: "-"
          RISUNEST_SYNC_TEST_REGISTRY_URL: https://registry.invalid/risunest-agent-test/
        run: |
          set -euo pipefail
          version="$(node -p "require('./artifacts/sync/release-input.json').version")"
          node server/manager/install/build.mjs \
            --target '${{ matrix.rust_target }}' \
            --output "$RISUNEST_SYNC_TEST_WORK/native" \
            --registry-url "$RISUNEST_SYNC_TEST_REGISTRY_URL" \
            --version "$version" 2>&1 | tee artifacts/sync/native-build.log
          cp "$RISUNEST_SYNC_TEST_WORK/native/native-build.json" artifacts/sync/native-build.json
          daemon="$(node -p "require('$RISUNEST_SYNC_TEST_WORK/native/native-build.json').daemon")"
          python3 server/sync/distribution/package.py \
            --binary "$daemon" \
            --target '${{ matrix.rust_target }}' \
            --version "$version" \
            --output "$RISUNEST_SYNC_TEST_WORK/raw" 2>&1 | tee artifacts/sync/raw-package.log
          raw_count="$(find "$RISUNEST_SYNC_TEST_WORK/raw" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')"
          test "$raw_count" -eq 1
          raw="$(find "$RISUNEST_SYNC_TEST_WORK/raw" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          vendor_sha="$(node -p "require('$RISUNEST_SYNC_TEST_WORK/vendor/vendor.json').executableSha256")"
          node server/manager/install/package.mjs \
            --native-build "$RISUNEST_SYNC_TEST_WORK/native/native-build.json" \
            --raw-archive "$raw" \
            --release-input artifacts/sync/release-input.json \
            --output "$RISUNEST_SYNC_TEST_WORK/packages" \
            --cloudflared-sha256 "$vendor_sha" 2>&1 | tee artifacts/sync/package.log
          node scripts/release/build.mjs \
            --release-input artifacts/sync/release-input.json \
            --leg 'sync_darwin_${{ matrix.arch }}' \
            --assets-json "$RISUNEST_SYNC_TEST_WORK/packages/assets.json" \
            --output "$RISUNEST_SYNC_TEST_WORK/release-out" \
            --public-key "$RISUNEST_UPDATE_PUBLIC_KEY"

      - name: Run macOS Sync LaunchAgent lifecycle
        if: matrix.kind == 'macos' && inputs.include_sync
        run: |
          set -euo pipefail
          native="$RISUNEST_SYNC_TEST_WORK/native/native-build.json"
          server="$(node -p "require('$native').daemon")"
          manager="$(node -p "require('$native').manager")"
          sh server/manager/tests/macos-startup.sh "$server" "$manager" 2>&1 | tee artifacts/sync/macos-startup.log

      - name: Apply and roll back the produced macOS Sync app
        if: matrix.kind == 'macos' && inputs.include_sync
        env:
          RISUNEST_TEST_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          inventory="$RISUNEST_SYNC_TEST_WORK/release-out/inventory-sync_darwin_${{ matrix.arch }}.json"
          managed="$(node -e "const path=require('node:path'); const i=require(process.argv[1]); const d=i.downloads.filter(x=>x.variant==='managed'&&x.format==='app.tar.gz'); if(d.length!==1)throw new Error('Expected one managed app archive'); console.log(path.join(path.dirname(process.argv[1]),d[0].fileName));" "$inventory")"
          sh server/manager/tests/macos-update.sh "$managed" "$managed.sig" "$inventory" 2>&1 | tee artifacts/sync/macos-update.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/sync/macos-update.log
          cp "$inventory" artifacts/sync/update-inventory.json

      - name: Verify extracted and mounted macOS Sync packages
        if: matrix.kind == 'macos' && inputs.include_sync
        run: |
          set -euo pipefail
          assets="$RISUNEST_SYNC_TEST_WORK/packages/assets.json"
          node --input-type=module - "$assets" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const assets = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.deepEqual(
            assets.map(({ download }) => [download.product, download.variant, download.os, download.arch, download.format]),
            [
              ["sync", "raw", "darwin", '${{ matrix.arch }}', "tar.gz"],
              ["sync", "managed", "darwin", '${{ matrix.arch }}', "dmg"],
              ["sync", "managed", "darwin", '${{ matrix.arch }}', "app.tar.gz"],
            ],
          );
          NODE
          raw="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.variant==='raw').path)")"
          dmg="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.format==='dmg').path)")"
          updater="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.format==='app.tar.gz').path)")"
          test -s "$raw"
          test -s "$dmg"
          test -s "$updater"
          tar_stage="$(mktemp -d "$RUNNER_TEMP/risunest-sync-agent-test-tar.XXXXXX")"
          dmg_mount="$(mktemp -d "$RUNNER_TEMP/risunest-sync-agent-test-dmg.XXXXXX")"
          tar -xzf "$updater" -C "$tar_stage"
          mounted=0
          cleanup_sync_mount() {
            if [ "$mounted" -eq 1 ]; then hdiutil detach "$dmg_mount" || true; fi
          }
          trap cleanup_sync_mount EXIT
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$dmg_mount" "$dmg" > artifacts/sync/dmg-attach.txt
          mounted=1
          verify_sync_app() {
            root="$1"
            label="$2"
            app="$root/RisuNest Sync.app"
            test -d "$app"
            plutil -lint "$app/Contents/Info.plist"
            codesign --verify --deep --strict "$app" 2>&1 | tee -a artifacts/sync/codesign.txt
            codesign -dv --verbose=4 "$app" 2>> artifacts/sync/codesign.txt
            node --input-type=module - "$app" artifacts/sync/release-input.json '${{ matrix.arch }}' "$label" <<'NODE'
          import assert from "node:assert/strict";
          import { createHash } from "node:crypto";
          import { lstatSync, readFileSync, readdirSync } from "node:fs";
          import { basename, join, relative } from "node:path";
          import { assertBinaryArchitecture } from "./scripts/release/platform/native.mjs";

          const [app, releaseInputPath, arch, label] = process.argv.slice(2);
          const releaseInput = JSON.parse(readFileSync(releaseInputPath, "utf8"));
          const markerPath = join(app, "Contents/Resources/risunest-sync-bundle.json");
          const inventory = JSON.parse(readFileSync(markerPath, "utf8"));
          assert.deepEqual(Object.keys(inventory).sort(), ["files", "product", "protocolId", "schema", "storeFormatId", "variant", "vendor", "version"]);
          assert.equal(inventory.schema, "risunest-sync-bundle/v1");
          assert.equal(inventory.product, "sync");
          assert.equal(inventory.variant, "managed");
          assert.equal(inventory.version, releaseInput.version);
          assert.equal(inventory.protocolId, releaseInput.compatibility.protocolId);
          assert.equal(inventory.storeFormatId, releaseInput.compatibility.storeFormatId);
          function filesUnder(directory) {
            return readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const path = join(directory, entry.name);
              if (entry.isSymbolicLink()) throw new Error(`Symlink in final Sync app: ${path}`);
              return entry.isDirectory() ? filesUnder(path) : [path];
            });
          }
          const actual = filesUnder(app)
            .filter((path) => path !== markerPath)
            .map((path) => relative(app, path).replaceAll("\\", "/"))
            .sort();
          assert.equal(new Set(inventory.files).size, inventory.files.length);
          assert.deepEqual([...inventory.files].sort(), actual);
          assert.equal(inventory.vendor.length, 1);
          const vendor = inventory.vendor[0];
          assert.deepEqual(Object.keys(vendor).sort(), ["arch", "name", "os", "path", "sha256", "version"]);
          assert.equal(vendor.name, "cloudflared");
          assert.equal(vendor.version, releaseInput.vendorInput.version);
          assert.equal(vendor.os, "darwin");
          assert.equal(vendor.arch, arch);
          const vendorPath = join(app, ...vendor.path.split("/"));
          assert.equal(createHash("sha256").update(readFileSync(vendorPath)).digest("hex"), vendor.sha256);
          const unique = (name) => {
            const matches = filesUnder(app).filter((path) => basename(path) === name);
            assert.equal(matches.length, 1, `${label}: expected one ${name}`);
            return matches[0];
          };
          const gui = unique("risunest-sync-gui");
          for (const binary of [gui, unique("risunest-sync-server"), unique("risunest-sync-manager"), vendorPath])
            assertBinaryArchitecture(binary, arch, "macho");
          console.log(JSON.stringify({ label, inventoryFiles: actual.length, version: inventory.version, arch }));
          NODE
          }
          verify_sync_app "$tar_stage" updater | tee -a artifacts/sync/package-evidence.jsonl
          verify_sync_app "$dmg_mount" dmg | tee -a artifacts/sync/package-evidence.jsonl
          test "$(grep -c '^Signature=adhoc$' artifacts/sync/codesign.txt)" -eq 2
          hdiutil detach "$dmg_mount"
          mounted=0
          cp "$raw" "artifacts/sync/packages/RisuNest-Sync-agent-test-macos-${{ matrix.arch }}-raw.tar.gz"
          cp "$dmg" "artifacts/sync/packages/RisuNest-Sync-agent-test-macos-${{ matrix.arch }}-managed.dmg"
          cp "$updater" "artifacts/sync/packages/RisuNest-Sync-agent-test-macos-${{ matrix.arch }}-managed.app.tar.gz"
          cp "$assets" artifacts/sync/package-assets.json
          shasum -a 256 artifacts/sync/packages/* > artifacts/sync/packages.sha256
          cat artifacts/sync/package-evidence.jsonl artifacts/sync/packages.sha256

      - name: Capture committed Apple shell inputs
        if: matrix.kind == 'ios'
        run: |
          set -euo pipefail
          test -f src-tauri/gen/apple/project.yml
          test -f src-tauri/gen/apple/Sources/risunest/main.mm
          test -f src-tauri/gen/apple/risunest.xcodeproj/project.pbxproj
          test -z "$(git status --short --untracked-files=all -- src-tauri/gen/apple)"
          git diff --exit-code -- src-tauri/gen/apple
          pnpm tauri ios build --help > artifacts/ios-build-help.txt
          grep -q -- '--no-sign' artifacts/ios-build-help.txt
          python3 ../control/scripts/ios-shell-inputs.py src-tauri/gen/apple artifacts/apple-shell-before

      - name: Build Tauri unsigned iPhoneOS ARM64 test package
        if: matrix.kind == 'ios'
        env:
          TAURI_ENV_PLATFORM: ios
        run: |
          set -euo pipefail
          pnpm tauri ios build --ci --target aarch64 --no-sign \
            --config src-tauri/tauri.agent.conf.json \
            --config "$RUNNER_TEMP/apple-prebuilt.json" 2>&1 | tee artifacts/ios-build.log

      - name: Verify Apple shell preservation
        if: matrix.kind == 'ios'
        run: |
          set -euo pipefail
          python3 ../control/scripts/ios-shell-inputs.py src-tauri/gen/apple artifacts/apple-shell-after
          python3 ../control/scripts/ios-shell-inputs.py compare \
            artifacts/apple-shell-before/apple-shell-inputs.json \
            artifacts/apple-shell-after/apple-shell-inputs.json \
            artifacts/apple-shell-preservation.json
          git status --short --untracked-files=all -- src-tauri/gen/apple > artifacts/apple-shell-generated-status.txt
          cat artifacts/apple-shell-preservation.json artifacts/apple-shell-generated-status.txt

      - name: Verify Tauri unsigned iPhoneOS package
        if: matrix.kind == 'ios'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import plistlib

          release_input = json.loads(pathlib.Path("artifacts/release-input.json").read_text())
          tauri_config = json.loads(pathlib.Path("src-tauri/tauri.conf.json").read_text())
          matches = []
          for app in pathlib.Path("src-tauri/gen/apple").glob("build/**/*.xcarchive/Products/Applications/*.app"):
              info_path = app / "Info.plist"
              if not info_path.is_file():
                  continue
              with info_path.open("rb") as file:
                  info = plistlib.load(file)
              if info.get("CFBundleIdentifier") == "io.github.rsyumi.risunest" and info.get("CFBundleSupportedPlatforms") == ["iPhoneOS"]:
                  matches.append((app, info))
          assert len(matches) == 1, f"Expected one archived iPhoneOS app, found {len(matches)}"
          app, info = matches[0]
          assert info.get("MinimumOSVersion") == "16.4", info.get("MinimumOSVersion")
          assert info.get("CFBundleVersion") == release_input["iosBuildNumber"], info.get("CFBundleVersion")
          expected_documents = [{
              "CFBundleTypeExtensions": association["ext"],
              "CFBundleTypeName": association["ext"][0],
              "CFBundleTypeRole": "Editor",
              "LSHandlerRank": "Default",
          } for association in tauri_config["bundle"]["fileAssociations"]]
          assert info.get("CFBundleDocumentTypes") == expected_documents, info.get("CFBundleDocumentTypes")
          expected_urls = [{
              "CFBundleURLSchemes": deep_link["scheme"],
              "CFBundleURLName": deep_link["scheme"][0],
          } for deep_link in tauri_config["plugins"]["deep-link"]["mobile"]]
          assert info.get("CFBundleURLTypes") == expected_urls, info.get("CFBundleURLTypes")
          ipas = list(pathlib.Path("src-tauri/gen/apple").glob("build/**/*.ipa"))
          assert len(ipas) == 1, f"Expected one Tauri-produced IPA, found {len(ipas)}"
          ipa = ipas[0]
          assert ipa.name == "RisuNest.ipa", ipa
          executable = app / info["CFBundleExecutable"]
          assert executable.is_file(), "Missing iPhoneOS executable"
          pathlib.Path("artifacts/ios-app.json").write_text(json.dumps({
              "app": str(app),
              "ipa": str(ipa),
              "executable": str(executable),
              "identifier": info["CFBundleIdentifier"],
              "platforms": info["CFBundleSupportedPlatforms"],
              "minimumOS": info["MinimumOSVersion"],
              "buildNumber": info["CFBundleVersion"],
              "documentExtensions": info["CFBundleDocumentTypes"][0]["CFBundleTypeExtensions"],
              "urlSchemes": info["CFBundleURLTypes"][0]["CFBundleURLSchemes"],
              "signing": "unsigned test build",
          }, indent=2) + "\n")
          PY
          app="$(node -p 'require("./artifacts/ios-app.json").app')"
          ipa="$(node -p 'require("./artifacts/ios-app.json").ipa')"
          executable="$(node -p 'require("./artifacts/ios-app.json").executable')"
          plutil -lint "$app/Info.plist"
          lipo "$executable" -verify_arch arm64
          xcrun vtool -show-build "$executable" > artifacts/macho-platform.txt
          grep -Eq 'platform[[:space:]]+IOS$' artifacts/macho-platform.txt
          if codesign -dv "$app" > artifacts/codesign.txt 2>&1; then
            echo 'Expected an unsigned iPhoneOS app.' >&2
            exit 1
          fi
          test -s "$ipa"
          cp "$ipa" artifacts/RisuNest-agent-test-ios-aarch64-unsigned.ipa
          node scripts/release/package-app.mjs \
            --kind ios \
            --arch aarch64 \
            --package artifacts/RisuNest-agent-test-ios-aarch64-unsigned.ipa \
            --output artifacts/package-proof \
            --release-input artifacts/release-input.json
          shasum -a 256 artifacts/RisuNest-agent-test-ios-aarch64-unsigned.ipa > artifacts/package.sha256
          cat artifacts/package-proof/ios-package-inventory.json artifacts/macho-platform.txt artifacts/package.sha256

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risunest-agent-test-${{ matrix.id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 3
          if-no-files-found: warn

  linux-app:
    name: ${{ matrix.name }}
    if: inputs.include_linux && inputs.include_linux_app
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 agent test AppImage and DEB
            id: linux-app-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: Linux ARM64 agent test AppImage and DEB
            id: linux-app-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: pnpm/action-setup@v5
        with:
          version: 10.34.1

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}

      - uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
          key: linux-app-agent-test-cargo-1.97.1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('source/src-tauri/Cargo.lock') }}
          restore-keys: linux-app-agent-test-cargo-1.97.1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install production Linux package dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential pkg-config libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev
          libayatana-appindicator3-dev librsvg2-dev patchelf desktop-file-utils
          shared-mime-info xdg-utils libfuse2t64 file binutils

      - name: Verify snapshot and record Linux environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          node ../control/scripts/verify-snapshot.mjs . macos
          mkdir -p artifacts/packages artifacts/package-proof
          cp .build-lab/source.json artifacts/source.json
          cp .build-lab/files.json artifacts/files.json
          {
            printf 'artifact_scope=agent-test-build-only\n'
            printf 'workflow_sha=%s\nsnapshot_sha=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$SNAPSHOT_SHA" "$GITHUB_RUN_ATTEMPT"
            printf 'matrix_id=%s\nrunner=%s\nrust_target=%s\n' '${{ matrix.id }}' '${{ matrix.runner }}' '${{ matrix.rust_target }}'
            uname -a
            rustc -Vv
            cargo -V
            node -v
            pnpm -v
            ldd --version | sed -n '1p'
            dpkg-deb --version | sed -n '1p'
            df -h .
            sha256sum pnpm-lock.yaml src-tauri/Cargo.lock
          } > artifacts/environment.txt
          cat artifacts/environment.txt

      - name: Install locked frontend inputs
        run: pnpm install --frozen-lockfile

      - name: Build agent frontend and prepare test release inputs
        run: |
          set -euo pipefail
          pnpm build:agent 2>&1 | tee artifacts/frontend.log
          test -s dist/index.html
          printf '%s\n' '{"build":{"beforeBuildCommand":"test -f dist/index.html"}}' > "$RUNNER_TEMP/linux-prebuilt.json"
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
          writeFileSync(
            "artifacts/release-input.json",
            `${JSON.stringify({ product: "app", version: config.version }, null, 2)}\n`,
          );
          NODE

      - name: Generate ephemeral test-only updater key
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/risunest-agent-test-updater-${{ matrix.id }}.key"
          timeout 30s pnpm exec -- tauri signer generate --ci --password "" --write-keys "$key_file" >/dev/null 2>&1
          test -s "$key_file"
          test -s "$key_file.pub"
          private_key="$(cat "$key_file")"
          public_key="$(cat "$key_file.pub")"
          echo "::add-mask::$private_key"
          private_delimiter="RISUNEST_TEST_PRIVATE_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          public_delimiter="RISUNEST_TEST_PUBLIC_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            printf 'TAURI_SIGNING_PRIVATE_KEY<<%s\n%s\n%s\n' "$private_delimiter" "$private_key" "$private_delimiter"
            printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n'
            printf 'RISUNEST_UPDATE_PUBLIC_KEY<<%s\n%s\n%s\n' "$public_delimiter" "$public_key" "$public_delimiter"
          } >> "$GITHUB_ENV"
          printf 'ephemeral_updater_key=true\n' >> artifacts/environment.txt
          rm -f "$key_file" "$key_file.pub"

      - name: Build and inspect Linux test packages through release tooling
        env:
          TARGET: ${{ matrix.rust_target }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-work
          node scripts/release/tauri-config.mjs \
            --release-input artifacts/release-input.json \
            --output "$RUNNER_TEMP/release-tauri.json"
          pnpm exec -- tauri build --target "$TARGET" --no-bundle \
            --config src-tauri/tauri.agent.conf.json \
            --config "$RUNNER_TEMP/release-tauri.json" \
            --config "$RUNNER_TEMP/linux-prebuilt.json" -- --locked 2>&1 | tee artifacts/native-build.log
          cp "$CARGO_TARGET_DIR/$TARGET/release/RisuNest" release-work/app-binary
          pnpm exec -- tauri build --target "$TARGET" --bundles deb,appimage \
            --config src-tauri/tauri.agent.conf.json \
            --config "$RUNNER_TEMP/release-tauri.json" \
            --config "$RUNNER_TEMP/linux-prebuilt.json" -- --locked 2>&1 | tee artifacts/package-build.log
          node scripts/release/package-app.mjs \
            --kind desktop \
            --os linux \
            --arch "$ARCH" \
            --bundle-dir "$CARGO_TARGET_DIR/$TARGET/release/bundle" \
            --binary release-work/app-binary \
            --release-input artifacts/release-input.json \
            --output artifacts/package-proof 2>&1 | tee artifacts/package-inspection.log

      - name: Record Linux package and executable inventories
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node --input-type=module - "$ARCH" <<'NODE'
          import { copyFileSync, readFileSync } from "node:fs";
          import { join } from "node:path";
          import { assertBinaryArchitecture } from "./scripts/release/platform/native.mjs";

          const arch = process.argv[2];
          const assets = JSON.parse(readFileSync("artifacts/package-proof/assets.json", "utf8"));
          const expected = new Map([
            ["deb", ["package-inspected", "bundle-marker-deb"]],
            ["appimage", ["package-inspected", "bundle-marker-app"]],
          ]);
          if (assets.length !== expected.size) throw new Error(`Expected two Linux packages, found ${assets.length}.`);
          for (const asset of assets) {
            const format = asset.download?.format;
            if (!expected.has(format) || asset.download.product !== "app" || asset.download.variant !== "desktop" ||
                asset.download.os !== "linux" || asset.download.arch !== arch)
              throw new Error(`Unexpected Linux package identity: ${JSON.stringify(asset.download)}`);
            if (JSON.stringify([...asset.checks].sort()) !== JSON.stringify([...expected.get(format)].sort()))
              throw new Error(`Incomplete ${format} inspection evidence.`);
            if (asset.binaries?.length !== 1 || asset.binaries[0].arch !== arch || asset.binaries[0].format !== "elf")
              throw new Error(`Incomplete ${format} ELF proof.`);
            const extension = format === "deb" ? "deb" : "AppImage";
            copyFileSync(asset.path, join("artifacts/packages", `RisuNest-agent-test-linux-${arch}.${extension}`));
            const proofName = format === "deb" ? "deb-installed-app-proof" : "appimage-packaged-app-proof";
            copyFileSync(asset.binaries[0].path, join("artifacts/package-proof", proofName));
          }
          assertBinaryArchitecture("release-work/app-binary", arch, "elf");
          assertBinaryArchitecture("artifacts/package-proof/deb-installed-app-proof", arch, "elf");
          assertBinaryArchitecture("artifacts/package-proof/appimage-packaged-app-proof", arch, "elf");
          assertBinaryArchitecture(`artifacts/packages/RisuNest-agent-test-linux-${arch}.AppImage`, arch, "elf");
          NODE
          deb="artifacts/packages/RisuNest-agent-test-linux-$ARCH.deb"
          appimage="artifacts/packages/RisuNest-agent-test-linux-$ARCH.AppImage"
          test -s "$deb"
          test -s "$appimage"
          chmod +x "$appimage"
          dpkg-deb --contents "$deb" > artifacts/deb-entries.txt
          extraction="$RUNNER_TEMP/risunest-appimage-inventory-${{ matrix.id }}"
          mkdir -p "$extraction"
          (cd "$extraction" && "$GITHUB_WORKSPACE/source/$appimage" --appimage-extract >/dev/null)
          find "$extraction/squashfs-root" -printf '%P\n' | LC_ALL=C sort > artifacts/appimage-entries.txt
          test "$(find "$extraction/squashfs-root" -type f -name RisuNest | wc -l | tr -d ' ')" -eq 1
          file release-work/app-binary artifacts/package-proof/deb-installed-app-proof artifacts/package-proof/appimage-packaged-app-proof "$deb" "$appimage" > artifacts/binary-and-package-types.txt
          for binary in release-work/app-binary artifacts/package-proof/deb-installed-app-proof artifacts/package-proof/appimage-packaged-app-proof "$appimage"; do
            readelf -h "$binary"
          done > artifacts/elf-headers.txt
          sha256sum artifacts/packages/* > artifacts/packages.sha256
          cat artifacts/package-proof/assets.json artifacts/binary-and-package-types.txt artifacts/packages.sha256

      - name: Clear ephemeral test-only updater key environment
        if: always()
        run: |
          printf 'TAURI_SIGNING_PRIVATE_KEY=\n' >> "$GITHUB_ENV"
          printf 'TAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n' >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risunest-agent-test-${{ matrix.id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 3
          if-no-files-found: warn

  linux-sync:
    name: ${{ matrix.name }}
    if: inputs.include_linux && inputs.include_sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 Sync native package and lifecycle
            id: linux-x64
            runner: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            arch: x86_64
          - name: Linux ARM64 Sync native package and lifecycle
            id: linux-arm64
            runner: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt,clippy

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Verify snapshot and record Linux environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          node ../control/scripts/verify-snapshot.mjs . macos
          mkdir -p artifacts/sync/packages
          cp .build-lab/source.json artifacts/source.json
          cp .build-lab/files.json artifacts/files.json
          {
            printf 'artifact_scope=agent-test-build-only\n'
            printf 'workflow_sha=%s\nsnapshot_sha=%s\nrun_attempt=%s\n' "$GITHUB_SHA" "$SNAPSHOT_SHA" "$GITHUB_RUN_ATTEMPT"
            printf 'matrix_id=%s\nrunner=%s\nrust_target=%s\n' '${{ matrix.id }}' '${{ matrix.runner }}' '${{ matrix.rust_target }}'
            uname -a
            rustc -Vv
            cargo -V
            node -v
            systemctl --version | sed -n '1p'
            df -h .
            sha256sum crates/sync-wire/Cargo.lock server/sync/Cargo.lock server/manager/Cargo.lock
          } > artifacts/environment.txt
          cat artifacts/environment.txt

      - name: Run locked Sync wire, server and manager tests
        run: |
          set -euo pipefail
          cargo fmt --manifest-path server/sync/Cargo.toml --check
          cargo fmt --manifest-path server/manager/Cargo.toml --check
          cargo clippy --manifest-path server/sync/Cargo.toml --all-targets --locked \
            --target '${{ matrix.rust_target }}' -- -D warnings 2>&1 | tee artifacts/sync/clippy.log
          cargo test --manifest-path crates/sync-wire/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked -- --test-threads=1 2>&1 | tee artifacts/sync/rust-tests.log
          cargo test --manifest-path server/sync/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked -- --test-threads=1 2>&1 | tee -a artifacts/sync/rust-tests.log
          cargo test --manifest-path server/manager/Cargo.toml --target '${{ matrix.rust_target }}' --release --locked -- --test-threads=1 2>&1 | tee -a artifacts/sync/rust-tests.log

      - name: Run synthetic Linux installer rollback tests
        run: bash server/manager/install/install.test.sh

      - name: Prepare synthetic Linux Sync package inputs
        run: |
          set -euo pipefail
          test ! -e server/sync/README.md
          cat > server/sync/README.md <<'README'
          # RisuNest Sync agent test package

          Synthetic documentation generated only inside the isolated release build lab.
          README
          sync_work="$RUNNER_TEMP/risunest-sync-agent-test-${{ matrix.id }}"
          mkdir -p "$sync_work/native" "$sync_work/raw" "$sync_work/packages"
          printf 'synthetic_sync_readme=true\n' >> artifacts/environment.txt
          printf 'RISUNEST_SYNC_TEST_WORK=%s\n' "$sync_work" >> "$GITHUB_ENV"
          node scripts/release/vendor.mjs --target 'linux-${{ matrix.arch }}' --output "$sync_work/vendor"
          node --input-type=module - "$sync_work" <<'NODE'
          import { generateKeyPairSync, randomBytes, sign } from "node:crypto";
          import { copyFileSync, readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          import { releaseDownloads } from "./scripts/release/downloads.mjs";
          import { verifySignature } from "./scripts/release/signatures.mjs";

          const work = process.argv[2];
          const version = JSON.parse(readFileSync("server/version.json", "utf8"));
          const vendorInput = JSON.parse(readFileSync("scripts/release/cloudflared.json", "utf8"));
          const current = JSON.parse(readFileSync(join(work, "vendor/vendor.json"), "utf8"));
          const tag = `sync-v${version.version}`;
          const releaseInput = {
            product: "sync",
            tag,
            version: version.version,
            sourceCommit: JSON.parse(readFileSync(".build-lab/source.json", "utf8")).source_commit,
            pub_date: "2026-09-15T00:00:00.000Z",
            releasePage: `https://github.com/rsyumi/RisuNest/releases/tag/${tag}`,
            notes: "Synthetic Linux Sync producer verification only",
            localizedNotes: {},
            compatibility: version.compatibility,
            vendorInput,
            mobileBuildNumber: null,
            iosBuildNumber: null,
            expectedDownloads: releaseDownloads("sync", version.version),
          };
          writeFileSync(
            "artifacts/sync/release-input.json",
            `${JSON.stringify(releaseInput, null, 2)}\n`,
          );
          const { privateKey, publicKey } = generateKeyPairSync("ed25519");
          const keyId = randomBytes(8);
          const keyPacket = Buffer.concat([
            Buffer.from("Ed"),
            keyId,
            publicKey.export({ format: "der", type: "spki" }).subarray(-32),
          ]);
          const publicText = `untrusted comment: synthetic agent test public key\n${keyPacket.toString("base64")}\n`;
          const message = Buffer.from("RisuNest Linux Sync agent test key");
          const signature = sign(null, message, privateKey);
          const comment = Buffer.from("synthetic-key-validation");
          const signaturePacket = Buffer.concat([Buffer.from("Ed"), keyId, signature]);
          const globalSignature = sign(null, Buffer.concat([signature, comment]), privateKey);
          const signatureText = [
            "untrusted comment: synthetic agent test signature",
            signaturePacket.toString("base64"),
            `trusted comment: ${comment}`,
            globalSignature.toString("base64"),
          ].join("\n");
          verifySignature(message, signatureText, publicText);
          writeFileSync("artifacts/sync/updater-public.key", publicText);
          const delimiter = `RISUNEST_SYNC_TEST_PUBLIC_${process.env.GITHUB_RUN_ID}_${process.env.GITHUB_RUN_ATTEMPT}`;
          writeFileSync(
            process.env.GITHUB_ENV,
            `RISUNEST_UPDATE_PUBLIC_KEY<<${delimiter}\n${publicText}${delimiter}\n`,
            { flag: "a" },
          );
          const vendors = Object.entries(vendorInput.assets).map(([target, asset]) => ({
            name: "cloudflared",
            version: vendorInput.version,
            os: target.split("-")[0],
            arch: asset.actualArch,
            sha256: target === current.target ? current.executableSha256 : asset.sha256,
          }));
          writeFileSync("artifacts/sync/synthetic-product-manifest.json", `${JSON.stringify({
            schema: "risunest.product-release/v1",
            product: "sync",
            version: version.version,
            tag: `sync-v${version.version}`,
            sourceCommit: releaseInput.sourceCommit,
            releasePage: releaseInput.releasePage,
            notes: "Synthetic Linux extractor parity manifest",
            localizedNotes: {},
            pub_date: "2026-09-15T00:00:00.000Z",
            platforms: {},
            downloads: [],
            compatibility: version.compatibility,
            vendor: vendors,
          }, null, 2)}\n`);
          copyFileSync(join(work, "vendor/vendor.json"), "artifacts/sync/vendor.json");
          writeFileSync(
            process.env.GITHUB_ENV,
            `RISUNEST_CLOUDFLARED_INPUT=${join(work, "vendor/vendor.json")}\n`,
            { flag: "a" },
          );
          if (current.target !== 'linux-${{ matrix.arch }}' || current.actualArch !== '${{ matrix.arch }}')
            throw new Error("Pinned Linux cloudflared architecture mismatch.");
          NODE

      - name: Build raw and managed Linux Sync packages
        env:
          RISUNEST_SYNC_TEST_REGISTRY_URL: https://registry.invalid/risunest-agent-test/
        run: |
          set -euo pipefail
          : "${RISUNEST_UPDATE_PUBLIC_KEY:?Synthetic update public key is required}"
          version="$(node -p "require('./artifacts/sync/release-input.json').version")"
          node server/manager/install/build.mjs \
            --target '${{ matrix.rust_target }}' \
            --output "$RISUNEST_SYNC_TEST_WORK/native" \
            --registry-url "$RISUNEST_SYNC_TEST_REGISTRY_URL" \
            --version "$version" 2>&1 | tee artifacts/sync/native-build.log
          cp "$RISUNEST_SYNC_TEST_WORK/native/native-build.json" artifacts/sync/native-build.json
          daemon="$(node -p "require('$RISUNEST_SYNC_TEST_WORK/native/native-build.json').daemon")"
          python3 server/sync/distribution/package.py \
            --binary "$daemon" \
            --target '${{ matrix.rust_target }}' \
            --version "$version" \
            --output "$RISUNEST_SYNC_TEST_WORK/raw" 2>&1 | tee artifacts/sync/raw-package.log
          raw="$(find "$RISUNEST_SYNC_TEST_WORK/raw" -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test "$(find "$RISUNEST_SYNC_TEST_WORK/raw" -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 1
          test -n "$raw"
          vendor_sha="$(node -p "require('$RISUNEST_SYNC_TEST_WORK/vendor/vendor.json').executableSha256")"
          node server/manager/install/package.mjs \
            --native-build "$RISUNEST_SYNC_TEST_WORK/native/native-build.json" \
            --raw-archive "$raw" \
            --release-input artifacts/sync/release-input.json \
            --output "$RISUNEST_SYNC_TEST_WORK/packages" \
            --cloudflared-sha256 "$vendor_sha" 2>&1 | tee artifacts/sync/package.log

      - name: Run the production Rust extractor with a six-row selected-target manifest
        run: |
          set -euo pipefail
          assets="$RISUNEST_SYNC_TEST_WORK/packages/assets.json"
          managed="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.variant==='managed').path)")"
          RISUNEST_PACKAGE_FIXTURE="$managed" \
          RISUNEST_PRODUCT_MANIFEST="$(pwd)/artifacts/sync/synthetic-product-manifest.json" \
          RISUNEST_PACKAGE_FORMAT=tar.gz \
          RISUNEST_PACKAGE_OS=linux \
          RISUNEST_PACKAGE_ARCH='${{ matrix.arch }}' \
            cargo test --manifest-path server/manager/Cargo.toml \
              --target '${{ matrix.rust_target }}' --release --locked \
              --lib update::archive::tests::package_script_windows_zip_matches_the_runtime_extractor -- \
              --ignored --exact --test-threads=1 2>&1 | tee artifacts/sync/runtime-extractor.log
          grep -Eq 'test result: ok\. 1 passed; 0 failed; 0 ignored;' artifacts/sync/runtime-extractor.log
          tar -tzf "$managed" > artifacts/sync/managed-entries.txt
          if grep -Eq '^\./|/\.\.?(/|$)' artifacts/sync/managed-entries.txt; then
            echo 'Managed archive contains a path rejected by the updater.' >&2
            exit 1
          fi
          tar -xOf "$managed" risunest-sync-bundle.json > artifacts/sync/risunest-sync-bundle.json

      - name: Run native daemon, systemd, TUI and installer lifecycles
        run: |
          set -euo pipefail
          native="$RISUNEST_SYNC_TEST_WORK/native/native-build.json"
          server="$(node -p "require('$native').daemon")"
          manager="$(node -p "require('$native').manager")"
          node server/manager/tests/daemon-process.mjs "$server" "$manager" 2>&1 | tee artifacts/sync/daemon-process.log
          sudo loginctl enable-linger "$USER"
          test "$(loginctl show-user "$USER" -p Linger --value)" = yes
          systemctl --user daemon-reload
          python3 server/manager/tests/linux-process.py "$server" "$manager" 2>&1 | tee artifacts/sync/linux-process.log
          assets="$RISUNEST_SYNC_TEST_WORK/packages/assets.json"
          managed="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.variant==='managed').path)")"
          bash server/manager/install/managed-install.integration.test.sh "$managed" 2>&1 | tee artifacts/sync/managed-install.log

      - name: Collect Linux package evidence
        if: always()
        run: |
          set -euo pipefail
          if test -n "${RISUNEST_SYNC_TEST_WORK:-}" && test -f "$RISUNEST_SYNC_TEST_WORK/packages/assets.json"; then
            assets="$RISUNEST_SYNC_TEST_WORK/packages/assets.json"
            raw="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.variant==='raw').path)")"
            managed="$(node -e "const a=require('$assets'); console.log(a.find(x=>x.download.variant==='managed').path)")"
            cp "$raw" "artifacts/sync/packages/RisuNest-Sync-agent-test-linux-${{ matrix.arch }}-raw.tar.gz"
            cp "$managed" "artifacts/sync/packages/RisuNest-Sync-agent-test-linux-${{ matrix.arch }}-managed.tar.gz"
            cp "$assets" artifacts/sync/package-assets.json
            sha256sum artifacts/sync/packages/* > artifacts/sync/packages.sha256
            cat artifacts/sync/packages.sha256
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risunest-agent-test-${{ matrix.id }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 2
          if-no-files-found: warn

  windows-arm-cloudflared:
    name: Windows ARM x64 cloudflared lifecycle probe
    runs-on: windows-11-arm
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          if ($env:GITHUB_REF -notlike 'refs/heads/*') { throw 'A branch ref is required.' }
          if ($env:SNAPSHOT_SHA -notmatch '^[0-9a-f]{40}$') { throw 'A full lowercase snapshot SHA is required.' }

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify snapshot
        run: |
          if ((git rev-parse HEAD) -ne $env:SNAPSHOT_SHA) { throw 'Snapshot checkout mismatch.' }
          node ../control/scripts/verify-snapshot.mjs . macos
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot verification failed.' }
          node -e "if (process.arch !== 'arm64') throw new Error('Expected a native Windows ARM64 runner')"
          if ($LASTEXITCODE -ne 0) { throw 'Native runner verification failed.' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item .build-lab/source.json artifacts/source.json
          @(
            "artifact_scope=agent-test-build-only"
            "workflow_sha=$env:GITHUB_SHA"
            "snapshot_sha=$env:SNAPSHOT_SHA"
            "node_arch=$(node -p process.arch)"
            "runner_arch=$env:RUNNER_ARCH"
          ) | Set-Content -Encoding utf8NoBOM artifacts/windows-environment.txt

      - name: Fetch and verify pinned x64 cloudflared input
        run: |
          node scripts/release/vendor.mjs --target windows-aarch64 --output artifacts/cloudflared
          $vendor = Get-Content -Raw artifacts/cloudflared/vendor.json | ConvertFrom-Json
          $pinned = Get-Content -Raw scripts/release/cloudflared.json | ConvertFrom-Json
          if ($vendor.actualArch -ne 'x86_64') { throw 'Windows ARM cloudflared exception must use the pinned x64 binary.' }
          if ($vendor.version -ne $pinned.version) { throw 'Downloaded cloudflared version differs from the pin.' }
          node --input-type=module -e "import { assertBinaryArchitecture } from './scripts/release/platform/native.mjs'; console.log(JSON.stringify(assertBinaryArchitecture(process.argv[1], 'x86_64', 'pe')))" $vendor.executable |
            Tee-Object -FilePath artifacts/cloudflared-binary.json
          & $vendor.executable --version 2>&1 | Tee-Object -FilePath artifacts/cloudflared-version.txt
          if ($LASTEXITCODE -ne 0) { throw 'The pinned x64 cloudflared binary did not execute under Windows ARM emulation.' }

      - name: Probe quick-tunnel readiness, stop, child exit, and restart
        id: quick-tunnel
        run: |
          $vendor = Get-Content -Raw artifacts/cloudflared/vendor.json | ConvertFrom-Json
          node scripts/release/verify-cloudflared.mjs --binary $vendor.executable *>&1 |
            Tee-Object -FilePath artifacts/cloudflared-lifecycle.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content -Raw artifacts/cloudflared-lifecycle.txt | ConvertFrom-Json
          if ($evidence.schema -ne 'risunest-cloudflared-lifecycle/v1' -or $evidence.output -ne 'json' -or $evidence.runs.Count -ne 2) {
            throw 'Cloudflared lifecycle evidence is incomplete.'
          }
          foreach ($run in $evidence.runs) {
            if (-not $run.urlPublished -or -not $run.edgeRegistered -or -not $run.originProxied -or -not $run.stopRequested -or -not $run.stopped) {
              throw 'Cloudflared lifecycle did not prove start, readiness, proxy, and stop.'
            }
          }

      - name: Record required network probe result
        if: always()
        env:
          QUICK_TUNNEL_OUTCOME: ${{ steps.quick-tunnel.outcome }}
        run: |
          @{ quickTunnel = $env:QUICK_TUNNEL_OUTCOME; required = $true } |
            ConvertTo-Json | Set-Content -Encoding utf8NoBOM artifacts/cloudflared-network-result.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risunest-agent-test-windows-arm-cloudflared-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: |
            source/artifacts/source.json
            source/artifacts/windows-environment.txt
            source/artifacts/cloudflared/vendor.json
            source/artifacts/cloudflared-binary.json
            source/artifacts/cloudflared-version.txt
            source/artifacts/cloudflared-lifecycle.txt
            source/artifacts/cloudflared-network-result.json
          retention-days: 3
          if-no-files-found: warn
