name: Windows NSIS check
run-name: Windows NSIS ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Sync snapshot commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  nsis:
    runs-on: windows-11-arm
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:SNAPSHOT_SHA -notmatch '^[0-9a-f]{40}$') { throw 'invalid dispatch' }
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify snapshot
        run: |
          if ((git rev-parse HEAD) -ne $env:SNAPSHOT_SHA) { throw 'snapshot mismatch' }
          node ../control/scripts/verify-snapshot.mjs . sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item .build-lab/source.json artifacts/source.json
      - name: Install pinned NSIS compiler
        run: |
          $nsisRoot = Join-Path $env:RUNNER_TEMP 'nsis-check'
          New-Item -ItemType Directory -Force -Path $nsisRoot | Out-Null
          $archive = Join-Path $nsisRoot 'nsis-3.11.zip'
          Invoke-WebRequest 'https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.11/nsis-3.11.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'c7d27f780ddb6cffb4730138cd1591e841f4b7edb155856901cdf5f214394fa1') { throw 'NSIS archive hash mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $nsisRoot
          "NSIS_MAKENSIS=$(Join-Path $nsisRoot 'nsis-3.11/makensis.exe')" >> $env:GITHUB_ENV
      - name: Verify explicit cleanup and retained retry state
        env:
          RISUNEST_REQUIRE_NSIS: '1'
        run: |
          & node --test tests/release/app-nsis-uninstall.node-test.mjs 2>&1 | Tee-Object -FilePath artifacts/nsis.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nsis-arm64-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 3
