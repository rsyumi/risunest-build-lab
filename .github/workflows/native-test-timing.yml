name: Native test timing
run-name: Native timing ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Sync snapshot commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-2022, target: x86_64-pc-windows-msvc }
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify snapshot
        run: |
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          node ../control/scripts/verify-snapshot.mjs . sync
          mkdir -p artifacts
          cp .build-lab/source.json artifacts/source.json
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          targets: ${{ matrix.target }}
      - name: Compile test binary
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --locked --target ${{ matrix.target }} --lib --no-run --message-format=json > artifacts/build.jsonl
      - name: Compare bounded storage tests with one and four workers
        run: |
          binary=$(python -c 'import json; from pathlib import Path; rows=[json.loads(x) for x in Path("artifacts/build.jsonl").read_text().splitlines()]; matches=[x["executable"] for x in rows if x.get("reason")=="compiler-artifact" and x.get("profile",{}).get("test") and x.get("target",{}).get("name")=="risunest_lib" and x.get("executable")]; assert len(matches)==1,matches; print(matches[0])')
          python benchmarks/native-storage/run-test-profile.py --binary "$binary" --skip-system-temp --root runner-temp="$RUNNER_TEMP" --threads 1 --threads 4 \
            --test external_storage::packaging::tests::c_a_spool_with_room_for_two_objects_still_finishes_the_publication \
            --test external_storage::packaging::tests::c_a_no_op_publication_whose_every_run_exceeds_the_bound_writes_nothing \
            --test external_storage::packaging::tests::c_required_edits_beyond_the_bound_are_all_published_beside_a_bounded_cycle \
            2>&1 | tee artifacts/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-timing-${{ matrix.target }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 3
