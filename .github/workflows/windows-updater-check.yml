name: Windows updater check
run-name: Windows updater ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Sync snapshot commit SHA
        type: string
        required: true
      architecture:
        description: Windows architecture
        type: choice
        default: arm64
        options: [arm64, x64]
permissions:
  contents: read
jobs:
  updater:
    runs-on: ${{ inputs.architecture == 'arm64' && 'windows-11-arm' || 'windows-2022' }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: "0"
      TARGET: ${{ inputs.architecture == 'arm64' && 'aarch64-pc-windows-msvc' || 'x86_64-pc-windows-msvc' }}
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main' -or $env:SNAPSHOT_SHA -notmatch '^[0-9a-f]{40}$') { throw 'invalid dispatch' }
          git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify snapshot
        run: |
          if ((git rev-parse HEAD) -ne $env:SNAPSHOT_SHA) { throw 'snapshot mismatch' }
          node ../control/scripts/verify-snapshot.mjs . sync
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item .build-lab/source.json artifacts/source.json
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: "1.97.1"
          targets: ${{ env.TARGET }}
      - uses: actions/cache/restore@v5
        with:
          path: source/src-tauri/target
          key: updater-1.97.1-${{ env.TARGET }}-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: updater-1.97.1-${{ env.TARGET }}-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-
      - name: Build process executables
        id: build
        run: |
          cargo build --manifest-path server/sync/Cargo.toml --release --locked --target ${{ env.TARGET }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --manifest-path server/manager/Cargo.toml --release --locked --target ${{ env.TARGET }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test manager transactions
        run: |
          & cargo test --manifest-path server/manager/Cargo.toml --release --locked --target ${{ env.TARGET }} --lib 2>&1 |
            Tee-Object -FilePath artifacts/manager-tests.log | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run all scheduled update cases
        env:
          RISUNEST_TEST_SERVER: ${{ env.CARGO_TARGET_DIR }}/${{ env.TARGET }}/release/risunest-sync-server.exe
          RISUNEST_TEST_MANAGER: ${{ env.CARGO_TARGET_DIR }}/${{ env.TARGET }}/release/risunest-sync-manager.exe
        run: |
          & cargo test --manifest-path server/manager/Cargo.toml --release --locked --target ${{ env.TARGET }} --test update_helper -- --ignored --test-threads=1 --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/update-helper.log -OutVariable output | Out-Host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (($output | Out-String) -notmatch 'test result: ok\. 8 passed; 0 failed; 0 ignored;') { throw 'incomplete update test inventory' }
      - uses: actions/cache/save@v5
        if: always() && !cancelled() && steps.build.outcome == 'success'
        with:
          path: source/src-tauri/target
          key: updater-1.97.1-${{ env.TARGET }}-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-updater-${{ env.TARGET }}-${{ inputs.source_sha }}-${{ github.run_attempt }}
          path: source/artifacts/
          retention-days: 3
