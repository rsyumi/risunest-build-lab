name: Linux installer check
run-name: Linux installer ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full Sync snapshot commit SHA
        type: string
        required: true
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: source
    env:
      SNAPSHOT_SHA: ${{ inputs.source_sha }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/source/src-tauri/target
      CARGO_INCREMENTAL: "0"
      TARGET: x86_64-unknown-linux-gnu
      RISUNEST_DEFAULT_REGISTRY_URL: https://example.invalid
    steps:
      - name: Validate dispatch
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$SNAPSHOT_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify snapshot
        run: |
          test "$(git rev-parse HEAD)" = "$SNAPSHOT_SHA"
          node ../control/scripts/verify-snapshot.mjs . sync
          mkdir -p artifacts
          cp .build-lab/source.json artifacts/source.json
      - uses: dtolnay/rust-toolchain@4716b85f2fac3e324e64fa2810f6b5c3905760a5
        with:
          toolchain: "1.97.1"
          targets: ${{ env.TARGET }}
      - uses: actions/cache/restore@v5
        with:
          path: source/src-tauri/target
          key: linux-installer-1.97.1-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-${{ github.run_id }}
          restore-keys: linux-installer-1.97.1-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-
      - name: Build managed installer fixture
        run: |
          set -euo pipefail
          node scripts/release/vendor.mjs --target linux-x86_64 --output vendor
          export RISUNEST_CLOUDFLARED_INPUT="$(pwd)/vendor/vendor.json"
          export RISUNEST_CLOUDFLARED=$(node -p "require('./vendor/vendor.json').executable")
          export RISUNEST_CLOUDFLARED_LICENSE=$(node -p "require('./vendor/vendor.json').license")
          version=$(node -p "require('./server/version.json').version")
          node server/manager/install/build.mjs --target "$TARGET" --output native --registry-url "$RISUNEST_DEFAULT_REGISTRY_URL" --version "$version"
          tar -czf artifacts/raw.tar.gz -C native risunest-sync-server-console
          node -e "const fs=require('node:fs'); fs.writeFileSync('release-input.json',JSON.stringify({...require('./server/version.json'),vendorInput:require('./scripts/release/cloudflared.json')}));"
          vendor_sha=$(node -p "require('./vendor/vendor.json').executableSha256")
          node server/manager/install/package.mjs --native-build native/native-build.json --raw-archive artifacts/raw.tar.gz --release-input release-input.json --output packages --cloudflared-sha256 "$vendor_sha"
      - name: Run managed installer scenarios
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          systemctl --user daemon-reload
          env -u XDG_CONFIG_HOME -u XDG_DATA_HOME bash server/manager/install/managed-install.integration.test.sh "$(pwd)/packages/managed.tar.gz" 2>&1 | tee artifacts/installer.log
      - uses: actions/cache/save@v5
        if: always() && !cancelled()
        with:
          path: source/src-tauri/target
          key: linux-installer-1.97.1-${{ hashFiles('source/server/manager/Cargo.lock', 'source/server/sync/Cargo.lock') }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-installer-${{ inputs.source_sha }}
          path: source/artifacts/
          retention-days: 3
