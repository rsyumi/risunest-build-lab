[package]
name = "risunest-native-lua-containment"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
risunest-native-lua-experimental = { path = "../../crates/native-lua-experimental" }
serde_json = "=1.0.154"
mlua = { version = "=0.12.2", features = ["lua54", "vendored", "serde"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"

[patch.crates-io]
lua-src = { path = "../../crates/lua-src-terminal" }
mlua-sys = { path = "../../crates/mlua-sys-terminal" }
mlua = { path = "../../crates/mlua-terminal" }

[features]
default = ["lua54", "serde"]
lua54 = []
serde = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("lua55", "lua53", "lua52", "lua51", "luau", "luau-vector4", "luajit", "luajit52", "macros", "userdata-wrappers", "send", "async"))'] }

[[test]]
name = "upstream-thread"
path = "../../crates/mlua-terminal/tests/thread.rs"

[[test]]
name = "upstream-function"
path = "../../crates/mlua-terminal/tests/function.rs"

[[test]]
name = "upstream-memory"
path = "../../crates/mlua-terminal/tests/memory.rs"

[[test]]
name = "upstream-userdata"
path = "../../crates/mlua-terminal/tests/userdata.rs"

[[test]]
name = "upstream-table"
path = "../../crates/mlua-terminal/tests/table.rs"
